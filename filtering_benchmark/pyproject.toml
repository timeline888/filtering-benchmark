[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "filtering-benchmark"
version = "0.1.0"
description = "旋转机械振动/声学信号滤波降噪评估系统"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
keywords = ["signal-processing", "fault-diagnosis", "denoising", "vibration", "bearing"]

authors = [
    {name = "Filtering Benchmark Team"},
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Signal Processing",
]

dependencies = [
    "numpy>=1.24",
    "scipy>=1.11",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "loguru>=0.7",
    "tqdm>=4.65",
]

[project.optional-dependencies]
full = [
    "PyWavelets>=1.4",
    "EMD-signal>=1.5",
    "vmdpy>=0.2",
    "padasip>=1.2",
    "filterpy>=1.4",
    "librosa>=0.10",
    "noisereduce>=2.0",
    "scikit-learn>=1.3",
    "nptdms>=1.7",
    "pyuff>=2.0",
    "soundfile>=0.12",
    "h5py>=3.9",
    "torch>=2.0",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "plotly>=5.15",
    "jinja2>=3.1",
    "openpyxl>=3.1",
    "ray>=2.5",
    "joblib>=1.3",
    "typer>=0.9",
    "pytest>=7.4",
    "pytest-cov>=4.1",
]
audio = ["librosa", "noisereduce", "soundfile"]
wavelet = ["PyWavelets"]
decomposition = ["EMD-signal", "vmdpy"]
adaptive = ["padasip", "filterpy"]
ml = ["scikit-learn"]
deep = ["torch"]
parallel = ["ray", "joblib"]
report = ["matplotlib", "seaborn", "plotly", "jinja2", "openpyxl"]
test = ["pytest", "pytest-cov"]
dev = ["filtering-benchmark[full,test]"]

[project.scripts]
filter-bench = "cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
